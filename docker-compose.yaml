# This is a Docker Compose configuration for local use.

# Run all services:
# docker compose up --build --wait

services:
  mongodb:
    # See more: https://hub.docker.com/_/mongo
    image: "mongo:8.0"
    restart: no
    ports:
      - "27017:27017"
    volumes:
      - "mongodb:/data/db"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh 127.0.0.1:27017/local --quiet
      timeout: 5s
      start_period: 30s
      interval: 1m
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-onezeroeight}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-herewethinkbig}

  minio:
    # See more: https://hub.docker.com/r/minio/minio
    image: "minio/minio:RELEASE.2024-05-10T01-41-38Z"
    restart: no
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "minio:/data"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onezeroeight}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-herewethinkbig}

  maps:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.maps.app:app
    restart: no
    ports:
      - "8009:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      # Change limits if project needs more RAM, though try to stay within limits
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  clubs:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.clubs.app:app
    restart: no
    ports:
      - "8014:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      # Change limits if project needs more RAM, though try to stay within limits
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_started

  student-affairs:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.student_affairs.app:app
    restart: no
    ports:
      - "8015:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      # Change limits if project needs more RAM, though try to stay within limits
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  when2meet:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.when2meet.app:app
    restart: no
    ports:
      - "8020:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  tabletennis:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.tabletennis.app:app
    restart: no
    ports:
      - "8023:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  guard:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.guard.app:app
    restart: no
    ports:
      - "8013:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
      - "./service_account.json:/app/service_account.json:ro"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m
    depends_on:
      mongodb:
        condition: service_healthy

  forms:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.forms.app:app
    restart: no
    ports:
      - "8017:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m
    depends_on:
      mongodb:
        condition: service_healthy

  room-booking:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.room_booking.app:app
    restart: no
    ports:
      - "8008:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  postgres:
    image: "postgres:17.1"
    restart: no
    ports:
      - "5432:5432"
    volumes:
      - "postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      timeout: 5s
      start_period: 30s
      interval: 1m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  schedule-alembic-migrate:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.schedule.app:app
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    command: alembic -c src/schedule/alembic.ini upgrade head

  schedule:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.schedule.app:app
    restart: no
    ports:
      - "8024:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
      - "./src/schedule/predefined:/app/src/schedule/predefined:rw"
    environment:
      TZ: Europe/Moscow
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m
    depends_on:
      postgres:
        condition: service_healthy
      schedule-alembic-migrate:
        condition: service_completed_successfully

  schedule-assistant:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.schedule_assistant.app:app
    restart: no
    ports:
      - "8012:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
      - "./data:/app/data:rw"
    environment:
      TZ: Europe/Moscow
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

volumes:
  mongodb:
  minio:
  postgres:
