      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.guard.app:app
    pre_start:
      - command: ["python", "-m", "src.migrations", "guard"]
    restart: no
    ports:
      - "8013:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
