# This is a Docker Compose configuration for local use (Compose >= 5.3.0).

# Run all services:
# docker compose up --build --wait

services:
  mongodb:
    # See more: https://hub.docker.com/_/mongo
    # 8.0.x refuses to start on Linux kernels ≥6.19 (SERVER-121912 / TCMalloc rseq).
    # 8.2+ runs on those kernels (verified on 7.1.x).
    image: "mongo:8.3.11"
    restart: no
    entrypoint: ["bash", "/opt/mongodb/entrypoint.sh"]
    ports:
      - "27017:27017"
    volumes:
      - "mongodb:/data/db"
      - "mongodb_config:/data/configdb"
      - "./scripts/mongodb:/opt/mongodb:ro"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--nodb", "/opt/mongodb/ready.js"]
      timeout: 10s
      start_period: 30s
      interval: 10s
      retries: 12
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-onezeroeight}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-herewethinkbig}
      MONGO_REPLICA_HOST: mongodb:27017

  minio:
    # See more: https://hub.docker.com/r/minio/minio
    image: "minio/minio:RELEASE.2024-05-10T01-41-38Z"
    restart: no
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "minio:/data"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onezeroeight}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-herewethinkbig}

  maps:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.maps.app:app
    restart: no
    ports:
      - "8009:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      # Change limits if project needs more RAM, though try to stay within limits
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  clubs:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.clubs.app:app
    pre_start:
      - command: ["python", "-m", "src.migrations", "clubs"]
    restart: no
    ports:
      - "8014:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      # Change limits if project needs more RAM, though try to stay within limits
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_started

  student-affairs:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.student_affairs.app:app
    restart: no
    ports:
      - "8015:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      # Change limits if project needs more RAM, though try to stay within limits
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  board-games:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.board_games.app:app
    pre_start:
      - command: ["python", "-m", "src.migrations", "board_games"]
    restart: no
    ports:
      - "8016:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m
    depends_on:
      mongodb:
        condition: service_healthy

  when2meet:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.when2meet.app:app
    pre_start:
      - command: ["python", "-m", "src.migrations", "when2meet"]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: no
    ports:
      - "8020:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  events:
    build:
      context: .
      dockerfile: api.Dockerfile
      args:
        APP_MODULE: src.events.app:app
    pre_start:
      - command: ["python", "-m", "src.migrations", "events"]
    restart: no
    ports:
      - "8021:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m
    depends_on:
      mongodb:
        condition: service_healthy
