        condition: service_healthy
    restart: no
    ports:
      - "8023:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  guard:
