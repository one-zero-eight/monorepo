# This is a Docker Compose configuration for local use.
#
# Run all services:
# docker compose -f docker-compose.test.yaml up --build --wait
#
# Ports are offset from docker-compose.yaml (27017 / 9000 / 9001 / 5432) so stacks can run together:
# Mongo 37017, MinIO API 19000, MinIO console 19001, Postgres 35432 — same numbers on host and in the lazytainer netns.

services:
  lazytainer:
    image: ghcr.io/vmorganp/lazytainer:master
    restart: no
    ports:
      - "37017:37017"
      - "19000:19000"
      - "19001:19001"
      - "35432:35432"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      VERBOSE: "false"
      IPV4_DISABLED: "false"
      IPV6_DISABLED: "true"
    labels:
      - "lazytainer.group.test-infra.ports=37017,19000,19001,35432"
      - "lazytainer.group.test-infra.inactiveTimeout=3600"
      - "lazytainer.group.test-infra.pollRate=60"
      - "lazytainer.group.test-infra.sleepMethod=stop"
      - "lazytainer.group.test-infra.minPacketThreshold=1"

  test-mongodb:
    image: "mongo:8.3.11"
    restart: no
    network_mode: service:lazytainer
    depends_on:
      - lazytainer
    labels:
      - "lazytainer.group=test-infra"
    entrypoint: ["bash", "/opt/mongodb/entrypoint.sh"]
    volumes:
      - mongodb_test:/data/db
      - mongodb_test_config:/data/configdb
      - ./scripts/mongodb:/opt/mongodb:ro
    environment:
      # Disable TCMalloc's per-CPU rseq path on affected kernels (SERVER-121912).
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test
      MONGO_PORT: "37017"
      MONGO_REPLICA_HOST: localhost:37017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--nodb", "/opt/mongodb/ready.js"]
      timeout: 10s
      start_period: 30s
      interval: 10s
      retries: 12

  test-minio:
    image: "quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z"
    restart: no
    network_mode: service:lazytainer
    depends_on:
      - lazytainer
    labels:
      - "lazytainer.group=test-infra"
    command: server /data --address ":19000" --console-address ":19001"
    volumes:
      - minio_test:/data
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: testsecret

  test-postgres:
    image: "postgres:17.1"
    restart: no
    network_mode: service:lazytainer
    depends_on:
      - lazytainer
    labels:
      - "lazytainer.group=test-infra"
    command: ["postgres", "-p", "35432"]
    volumes:
      - postgres_test:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: test

volumes:
  mongodb_test:
  mongodb_test_config:
  minio_test:
  postgres_test:
