# This is a Docker Compose configuration for local use.
#
# Run all services:
# docker compose -f docker-compose.test.yaml up --build --wait
#
# Ports are offset from docker-compose.yaml (27017 / 9000 / 9001) so stacks can run together:
# Mongo 37017, MinIO API 19000, MinIO console 19001 — same numbers on host and in the lazytainer netns.

services:
  lazytainer:
    image: ghcr.io/vmorganp/lazytainer:master
    restart: no
    ports:
      - "37017:37017"
      - "19000:19000"
      - "19001:19001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      VERBOSE: "false"
      IPV4_DISABLED: "false"
      IPV6_DISABLED: "true"
    labels:
      - "lazytainer.group.test-infra.ports=37017,19000,19001"
      - "lazytainer.group.test-infra.inactiveTimeout=3600"
      - "lazytainer.group.test-infra.pollRate=60"
      - "lazytainer.group.test-infra.sleepMethod=stop"
      - "lazytainer.group.test-infra.minPacketThreshold=1"

  mongodb:
    image: "mongo:8.0"
    restart: no
    network_mode: service:lazytainer
    depends_on:
      - lazytainer
    labels:
      - "lazytainer.group=test-infra"
    command: ["mongod", "--port", "37017"]
    volumes:
      - mongodb_test:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test

  minio:
    image: "minio/minio:RELEASE.2024-05-10T01-41-38Z"
    restart: no
    network_mode: service:lazytainer
    depends_on:
      - lazytainer
    labels:
      - "lazytainer.group=test-infra"
    command: server /data --address ":19000" --console-address ":19001"
    volumes:
      - minio_test:/data
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: testsecret

volumes:
  mongodb_test:
  minio_test:
