$schema: https://json-schema.org/draft-07/schema
$defs:
  AccessToRoom:
    additionalProperties: false
    properties:
      email:
        description: Email of the user
        title: Email
        type: string
      reason:
        default: ''
        description: Reason for access (f.e. 'Leader of 'one-zero-eight' club', or
          `Academic Tutorship`)
        title: Reason
        type: string
    required:
    - email
    title: AccessToRoom
    type: object
  AccountsSettings:
    additionalProperties: false
    description: InNoHassle Accounts integration settings
    properties:
      api_url:
        default: https://api.innohassle.ru/accounts/v0
        description: URL of the Accounts API
        title: Api Url
        type: string
      api_jwt_token:
        description: JWT token for accessing the Accounts API as a service
        format: password
        title: Api Jwt Token
        type: string
        writeOnly: true
      mock:
        default: false
        description: 'If true (development only), accept `Authorization: Bearer` values
          as JSON shaped like

          `UserTokenData` instead of validating a JWT. JWKS fetch is skipped.'
        title: Mock
        type: boolean
    required:
    - api_jwt_token
    title: AccountsSettings
    type: object
  BmpExchange:
    additionalProperties: false
    description: Dedicated BMP mailbox; bookings go to the default calendar with Auto
      markers.
    properties:
      username:
        description: BMP account email
        title: Username
        type: string
      password:
        description: Password for the BMP account
        format: password
        title: Password
        type: string
        writeOnly: true
    required:
    - username
    - password
    title: BmpExchange
    type: object
  ClubsSettings:
    additionalProperties: false
    description: Settings for the application.
    properties:
      environment:
        $ref: '#/$defs/Environment'
        default: development
        description: App environment flag
      app_root_path:
        default: ''
        description: Prefix for the API path (e.g. "/api/v0")
        title: App Root Path
        type: string
      cors_allow_origin_regex:
        default: .*
        description: 'Allowed origins for CORS: from which domains requests to the
          API are allowed.

          Specify as a regex: `https://.*.innohassle.ru`'
        title: Cors Allow Origin Regex
        type: string
      mongo:
        $ref: '#/$defs/MongoDatabaseSettings'
        description: Configuration for MongoDB
      minio:
        $ref: '#/$defs/MinioSettings'
        description: Configuration for S3 object storage
      superadmin_emails:
        description: Innomails of superadmins who can set admin roles
        items:
          type: string
        title: Superadmin Emails
        type: array
      at:
        format: date-time
        title: At
        type: string
    title: ClubsSettings
    type: object
  Environment:
    enum:
    - development
    - testing
    - production
    title: Environment
    type: string
  Exchange:
    additionalProperties: false
    description: Exchange (Outlook) integration settings
    properties:
      ews_endpoint:
        default: https://mail.innopolis.ru/EWS/Exchange.asmx
        description: URL of the EWS endpoint
        title: Ews Endpoint
        type: string
      username:
        description: Username for accessing the EWS endpoint (email)
        title: Username
        type: string
      password:
        description: Password for accessing the EWS endpoint
        format: password
        title: Password
        type: string
        writeOnly: true
      ews_callback_url:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: URL of the EWS callback for push subscription
        title: Ews Callback Url
      bmp:
        $ref: '#/$defs/BmpExchange'
        description: Dedicated BMP account and Auto calendar
    required:
    - username
    - password
    - bmp
    title: Exchange
    type: object
  FormsSettings:
    additionalProperties: false
    description: Settings for the application.
    properties:
      environment:
        $ref: '#/$defs/Environment'
        default: development
        description: App environment flag
      app_root_path:
        default: ''
        description: Prefix for the API path (e.g. "/api/v0")
        title: App Root Path
        type: string
      cors_allow_origin_regex:
        default: .*
        description: 'Allowed origins for CORS: from which domains requests to the
          API are allowed.

          Specify as a regex: `https://.*.innohassle.ru`'
        title: Cors Allow Origin Regex
        type: string
      mongo:
        $ref: '#/$defs/MongoDatabaseSettings'
        description: Configuration for MongoDB
      links:
        $ref: '#/$defs/LinksSettings'
    required:
    - links
    title: FormsSettings
    type: object
  GoogleServiceSettings:
    additionalProperties: false
    description: Google API settings (Service Account + Drive)
    properties:
      service_account_file_path:
        default: service_account.json
        description: 'Path to the Google service account file with credentials.


          Plain ``Path`` (not ``FilePath``): the monorepo loads the whole root ``Settings``
          for

          every service, so requiring the file to exist here would break other services
          that do

          not mount it. Existence is enforced lazily where the file is actually read.'
        format: path
        title: Service Account File Path
        type: string
      subject:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Email address to impersonate for domain-wide delegation (e.g.,
          service@innoguard.ru)
        title: Subject
      drive_folder_id:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Google Drive folder ID where new files will be created (optional)
        title: Drive Folder Id
    title: GoogleServiceSettings
    type: object
  GuardSettings:
    additionalProperties: false
    description: Settings for the application.
    properties:
      environment:
        $ref: '#/$defs/Environment'
        default: development
        description: App environment flag
      app_root_path:
        default: ''
        description: Prefix for the API path (e.g. "/api/v0")
        title: App Root Path
        type: string
      cors_allow_origin_regex:
        default: .*
        description: 'Allowed origins for CORS: from which domains requests to the
          API are allowed.

          Specify as a regex: `https://.*.innohassle.ru`'
        title: Cors Allow Origin Regex
        type: string
      mongo:
        $ref: '#/$defs/MongoDatabaseSettings'
        description: Configuration for MongoDB
      innohassle_url:
        default: https://innohassle.ru
        description: URL of the InNoHassle to use for links
        title: Innohassle Url
        type: string
      base_url:
        default: https://innohassle.ru
        description: Base URL for generating join links
        title: Base Url
        type: string
      google:
        $ref: '#/$defs/GoogleServiceSettings'
    title: GuardSettings
    type: object
  LinksSettings:
    additionalProperties: false
    description: Links and signature settings
    properties:
      signature_secret:
        description: Secret used to sign and verify form payload
        format: password
        title: Signature Secret
        type: string
        writeOnly: true
    required:
    - signature_secret
    title: LinksSettings
    type: object
  MapsSettings:
    additionalProperties: false
    properties:
      environment:
        $ref: '#/$defs/Environment'
        default: development
        description: App environment flag
      app_root_path:
        default: ''
        description: Prefix for the API path (e.g. "/api/v0")
        title: App Root Path
        type: string
      cors_allow_origin_regex:
        default: .*
        description: 'Allowed origins for CORS: from which domains requests to the
          API are allowed.

          Specify as a regex: `https://.*.innohassle.ru`'
        title: Cors Allow Origin Regex
        type: string
      static_mount_path:
        default: /static
        description: Path to mount static files
        title: Static Mount Path
        type: string
      static_directory:
        default: src/maps/static
        description: Path to the directory with static files
        format: path
        title: Static Directory
        type: string
    title: MapsSettings
    type: object
  MinioSettings:
    additionalProperties: false
    properties:
      endpoint:
        description: URL of the target service.
        examples:
        - 127.0.0.1:9000
        - minio:9000
        title: Endpoint
        type: string
      secure:
        default: false
        description: Use https connection to the service.
        title: Secure
        type: boolean
      region:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Region of the service.
        title: Region
      bucket:
        default: clubs
        description: Name of the bucket in the service.
        title: Bucket
        type: string
      access_key:
        default: onezeroeight
        description: Access key (user ID) of a user account in the service.
        title: Access Key
        type: string
      secret_key:
        default: '**********'
        description: Secret key (password) for the user account.
        format: password
        title: Secret Key
        type: string
        writeOnly: true
      club_logos_prefix:
        default: logos/
        title: Club Logos Prefix
        type: string
    title: MinioSettings
    type: object
  MongoDatabaseSettings:
    additionalProperties: false
    properties:
      uri:
        description: MongoDB database settings, if you do not specify database name
          in the uri, it will use the service name (f.e. 'clubs')
        examples:
        - mongodb://onezeroeight:herewethinkbig@127.0.0.1:27017/?authSource=admin
        - mongodb://onezeroeight:herewethinkbig@mongodb:27017/?authSource=admin
        format: password
        title: Uri
        type: string
        writeOnly: true
    title: MongoDatabaseSettings
    type: object
  OmnideskSettings:
    additionalProperties: false
    properties:
      base_url:
        default: https://student-affairs.omnidesk.ru
        description: 'URL in format: https://mydomain.omnidesk.ru'
        title: Base Url
        type: string
      jwt_marker:
        description: 'JWT secret marker for user auth in Omnidesk. See instructions:
          https://support.omnidesk.ru/knowledge_base/item/54180'
        format: password
        title: Jwt Marker
        type: string
        writeOnly: true
    required:
    - jwt_marker
    title: OmnideskSettings
    type: object
  RoomBookingSettings:
    additionalProperties: false
    properties:
      environment:
        $ref: '#/$defs/Environment'
        default: development
        description: App environment flag
      app_root_path:
        default: ''
        description: Prefix for the API path (e.g. "/api/v0")
        title: App Root Path
        type: string
      cors_allow_origin_regex:
        default: .*
        description: 'Allowed origins for CORS: from which domains requests to the
          API are allowed.

          Specify as a regex: `https://.*.innohassle.ru`'
        title: Cors Allow Origin Regex
        type: string
      api_key:
        description: Secret key for accessing API by external services
        format: password
        title: Api Key
        type: string
        writeOnly: true
      access_lists:
        additionalProperties:
          items:
            $ref: '#/$defs/AccessToRoom'
          type: array
        description: Dictionary of access lists (room id -> access list)
        title: Access Lists
        type: object
      ttl_bookings_from_account_calendar:
        default: 60
        description: TTL for the bookings from account calendar cache in seconds
        title: Ttl Bookings From Account Calendar
        type: integer
      ttl_bookings_from_busy_info:
        default: 60
        description: TTL for the bookings from busy info cache in seconds
        title: Ttl Bookings From Busy Info
        type: integer
      recently_canceled_booking_ttl_sec:
        default: 300
        description: TTL for the recently-canceled booking IDs cache in seconds (skip
          cancel if already canceled within this window)
        title: Recently Canceled Booking Ttl Sec
        type: integer
      exchange:
        $ref: '#/$defs/Exchange'
      bmp_batch_confirm_timeout_s:
        default: 180
        description: Seconds to wait for each room meeting response during BMP batch
          booking confirm
        title: Bmp Batch Confirm Timeout S
        type: integer
    required:
    - api_key
    - exchange
    title: RoomBookingSettings
    type: object
  StudentAffairsSettings:
    additionalProperties: false
    properties:
      environment:
        $ref: '#/$defs/Environment'
        default: development
        description: App environment flag
      app_root_path:
        default: ''
        description: Prefix for the API path (e.g. "/api/v0")
        title: App Root Path
        type: string
      cors_allow_origin_regex:
        default: .*
        description: 'Allowed origins for CORS: from which domains requests to the
          API are allowed.

          Specify as a regex: `https://.*.innohassle.ru`'
        title: Cors Allow Origin Regex
        type: string
      omnidesk:
        $ref: '#/$defs/OmnideskSettings'
        description: Omnidesk integration settings
    required:
    - omnidesk
    title: StudentAffairsSettings
    type: object
  When2MeetSettings:
    additionalProperties: false
    properties:
      environment:
        $ref: '#/$defs/Environment'
        default: development
        description: App environment flag
      app_root_path:
        default: ''
        description: Prefix for the API path (e.g. "/api/v0")
        title: App Root Path
        type: string
      cors_allow_origin_regex:
        default: .*
        description: 'Allowed origins for CORS: from which domains requests to the
          API are allowed.

          Specify as a regex: `https://.*.innohassle.ru`'
        title: Cors Allow Origin Regex
        type: string
      service_name:
        default: when2meet
        description: Human-readable service name returned by the health endpoint
        title: Service Name
        type: string
      mongo:
        $ref: '#/$defs/MongoDatabaseSettings'
        description: Configuration for MongoDB
    title: When2MeetSettings
    type: object
additionalProperties: false
properties:
  $schema:
    anyOf:
    - type: string
    - type: 'null'
    default: null
    title: $Schema
  accounts:
    $ref: '#/$defs/AccountsSettings'
    description: Shared InNoHassle Accounts integration settings
  maps_service:
    $ref: '#/$defs/MapsSettings'
    default:
      environment: development
      app_root_path: ''
      cors_allow_origin_regex: .*
      static_mount_path: /static
      static_directory: src/maps/static
  clubs_service:
    anyOf:
    - $ref: '#/$defs/ClubsSettings'
    - type: 'null'
    default: null
  student_affairs_service:
    anyOf:
    - $ref: '#/$defs/StudentAffairsSettings'
    - type: 'null'
    default: null
  when2meet_service:
    anyOf:
    - $ref: '#/$defs/When2MeetSettings'
    - type: 'null'
    default: null
  guard_service:
    anyOf:
    - $ref: '#/$defs/GuardSettings'
    - type: 'null'
    default: null
  forms_service:
    anyOf:
    - $ref: '#/$defs/FormsSettings'
    - type: 'null'
    default: null
  room_booking_service:
    anyOf:
    - $ref: '#/$defs/RoomBookingSettings'
    - type: 'null'
    default: null
required:
- accounts
title: Settings
type: object
