[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/../..
path_separator = os
file_template = _%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d_%%(minute).2d_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = uv
ruff.options = run ruff format REVISION_SCRIPT_FILENAME
