mvp_v1_scope:
    - "US-001"
    - "US-002"
    - "US-003"
    - "US-006"

stories:
    - id: "US-001"
      priority: "Must Have"
      text: "As a meeting organizator, I want to create a new meeting so that I will predefine appropriate time."
    - id: "US-002"
      priority: "Must Have"
      text: "As a meeting organizator, I want to share a meeting so that I will collect users opinions about their comfortable time."
    - id: "US-003"
      priority: "Must Have"
      text: "As a meeting participant, I want to connect to the meeting via link, and put time that appropriate to me to share my opinion with other participants."
    - id: "US-004"
      priority: "Should Have"
      text: "As a meeting participant, I want to connect be aware about events in my calendar during shoosing time for meeting so that I will avoid events collision."
    - id: "US-005"
      priority: "Won't Have"
      text: "Provide a MEOW button, to make a funny kitten sound."
    - id: "US-006"
      priority: "Must Have"
      text: "As a meeting participant, I want to see other participants opinion on the heat map, to know which time is relevant for them."
    - id: "US-007"
      priority: "Should Have"
      text: "As a meeting organizator, I want to book a room within best time so that I will not spend time seeking available room."
    - id: "US-008"
      priority: "Could Have"
      text: "As a meeting organizator, I want to have an opportunity to provide a reminder to users about the meeting, so they will be engaged to provide their responses."
    - id: "US-009"
      priority: "Could Have"
      text: "As a meeting participant, I want to recieve a reminders about picking time, so I will not forget about giving availability feedback."
    - id: "US-010"
      priority: "Could Have"
      text: "As a meeting organizer, I want to be able to edit the details of an existing meeting (such as name and description) or cancel it entirely, so that I can adapt to changing plans and prevent participants from interacting with outdated or unnecessary events."
