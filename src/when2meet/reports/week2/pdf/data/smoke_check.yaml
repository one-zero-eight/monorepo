smoke_check:
  frontend:
    - "Open https://pre.innohassle.ru/when-to-meet"
    - "Expected: application loads; navigation between prototype screens works."
    - "Expected: at least one interactive scheduling flow is demonstrable."
  backend_hosted:
    - "Open https://api.innohassle.ru/when2meet/v0/docs"
    - "Expected: Swagger UI loads with event endpoints."
    - "POST /events/ — create meeting (US-001)"
    - "PUT /events/{id}/participants — submit availability (US-003)"
    - "GET /events/{id} — read aggregated data (US-006)"
  backend_local:
    - "Start MongoDB and run: uv run -m src.when2meet --reload"
    - "Open http://localhost:8020/docs"
    - "Same API smoke check under /api/v0"
