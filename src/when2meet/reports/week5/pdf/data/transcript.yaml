transcript:
  - section: "Discussion of Sprint 3 (design updates and meeting creation functionality)"
    entries:
      - time: "00:00:01"
        speaker: "Vladislav Konovalov"
        text: "Hi! This sprint has been focused on improving the app design and user experience. Now I'll show you how creating and editing a meeting works. The basic creation process hasn't changed: we still select the day and time slots."
      - time: "00:00:32"
        speaker: "Vladislav Konovalov"
        text: "However, if you select the option to specify time slots for each day, the next screen now pulls events from the calendar. They are displayed so the user is alerted and doesn't accidentally select a time when they're already busy."
      - time: "00:00:55"
        speaker: "Customer"
        text: "Is this pulled from your personal calendar?"
      - time: "00:00:57"
        speaker: "Vladislav Konovalov"
        text: "Yes, the data is pulled from your personal calendar in InnoHassle. You can hover over an event to see the details."
      - time: "00:01:03"
        speaker: "Customer"
        text: "Does this work on the phone?"
      - time: "00:01:07"
        speaker: "Vladislav Konovalov"
        text: "Yes, you can also view information about the event on the mobile version."
      - time: "00:01:12"
        speaker: "Customer"
        text: "Is it still possible to schedule a meeting for this time?"
      - time: "00:01:14"
        speaker: "Vladislav Konovalov"
        text: "Yes, you can schedule it for any time; this is just an informational alert. After saving the time slot, the meeting menu opens."
      - time: "00:01:41"
        speaker: "Vladislav Konovalov"
        text: "Here you'll see a list of participants who have responded, and you can mark your exact available time. Calendar events are only displayed when you select your own time."
      - time: "00:02:17"
        speaker: "Customer"
        text: "Maybe we should add a button to hide these events from the calendar? What if the person doesn't attend classes at all, and this information just distracts them?"
      - time: "00:02:26"
        speaker: "Vladislav Konovalov"
        text: "Okay, we'll add this feature in the next sprint. Now let's see what a meeting looks like with already filled slots. Your selected time is now clearly outlined with a border, making it easy to distinguish from other participants' responses. A filter has also been added to show only those slots with a certain number of people available."
      - time: "00:03:14"
        speaker: "Customer"
        text: "The filter is great, but I'm not sure the border selection is intuitive. It looks good, but we need to add a legend or somehow visually emphasize that this is my time."
      - time: "00:03:28"
        speaker: "Vladislav Konovalov"
        text: "Agreed, we'll add a small legend at the bottom explaining that the box represents your time slot, while the regular fill represents the total time slot for all participants. Then, after participants have filled in their time slots, they can book a room directly on the heatmap through the InnoHassle system."
      - time: "00:04:07"
        speaker: "Customer"
        text: "Right now, this action isn't clear. The button is green, and I don't understand what the system expects from me or what just happened. Booking itself shouldn't be mandatory. I'd like to see a separate window with the logic: \"Let's create a meeting, choose a time. If you want, we'll reserve a room, and then send the event to the calendar for all available participants.\" As it stands, everything is unclear."
      - time: "00:04:39"
        speaker: "Vladislav Konovalov"
        text: "We thought long and hard about the mechanics and decided that selecting the time directly on the heat map would be most convenient, since a simple list of options isn't as clear."
      - time: "00:04:54"
        speaker: "Customer"
        text: "However, right now the page state is opaque, and it is unclear what exactly is required from the user."
      - time: "00:04:59"
        speaker: "Vladislav Konovalov"
        text: "Okay, we will add more explanatory information for the user."
      - time: "00:05:11"
        speaker: "Vladislav Konovalov"
        text: "After choosing the time, you can select a free room from the list and confirm the reservation."
      - time: "00:05:23"
        speaker: "Customer"
        text: "The drop-down list looks strange and doesn't match the design elements of the rest of the site."
      - time: "00:05:28"
        speaker: "Vladislav Konovalov"
        text: "This is a standard native browser drop-down list. After using it, the booking for our meeting is created. This completes the sprint's workflow, and the created meeting should now appear in the calendar."
      - time: "00:06:10"
        speaker: "Customer"
        text: "I need a link to the meeting added to it so I can jump right into it. And another question: was this meeting added to the calendar for all available participants?"
      - time: "00:06:22"
        speaker: "Vladislav Konovalov"
        text: "No, the room booking functionality does not support this yet."
      - time: "00:06:33"
        speaker: "Customer"
        text: "This needs to be fixed. The event needs to appear in the calendars of all available participants, not just the creator."
      - time: "00:06:41"
        speaker: "Vladislav Konovalov"
        text: "This will require linking the booking logic to the meeting, as they currently exist separately. We'll do this, add a link, and implement a calendar push."
  - section: "UAT results"
    entries:
      - time: "00:07:13"
        speaker: "Vladislav Konovalov"
        text: "Now let's move on to acceptance tests. The first test verifies that when selecting a time, the user sees their current events from the calendar. As I've already demonstrated, existing events and their details are correctly displayed when selecting a time."
      - time: "00:07:47"
        speaker: "Vladislav Konovalov"
        text: "The second test checks the ability to search for participants, view their available time, and remove them from a meeting. I opened a meeting with a large number of participants; the list now appears more compact."
      - time: "00:08:18"
        speaker: "Vladislav Konovalov"
        text: "At the moment, only email is displayed here."
      - time: "00:08:22"
        speaker: "Customer"
        text: "This is sad."
      - time: "00:08:26"
        speaker: "Vladislav Konovalov"
        text: "Searching the list works correctly. You can select one or more participants to view their individual availability. If you're the meeting owner, you can remove participants."
      - time: "00:08:58"
        speaker: "Customer"
        text: "I didn't see the delete confirmation button. What if I clicked it by accident?"
      - time: "00:09:04"
        speaker: "Vladislav Konovalov"
        text: "Fair enough, we'll add a confirmation window before deleting. The third test confirms the ability to reserve a free room for the selected time."
      - time: "00:09:33"
        speaker: "Vladislav Konovalov"
        text: "I've already demonstrated this functionality: we can choose a time, find an available room, and book it. I think that's all. Is there any other feedback?"
      - time: "00:09:59"
        speaker: "Customer"
        text: "It seems there is nothing else."
