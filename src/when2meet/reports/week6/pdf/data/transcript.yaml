transcript:
- section: Sprint 4 Discussion
  entries:
  - time: 00:00:01
    speaker: Nikita Lisitckii
    text: Hi! Another sprint is coming to an end, and we've got some new changes. Timur will now demonstrate
      the improvements.
  - time: 00:00:14
    speaker: Timur Khasanov
    text: 'We''ve taken into account previous feedback and separated the final meeting time selection
      and room booking into two separate actions. Now, the organizer can select a suitable time slot,
      save it, and the selected time will be visible to all participants. During the demo, we discovered
      a bug: currently, the selected time can''t be deleted. We''ll fix this.'
  - time: 00:00:43
    speaker: Timur Khasanov
    text: The booking service is currently temporarily unavailable. We've also added a legend to make
      the heatmap elements easier to understand.
  - time: 00:01:01
    speaker: Customer
    text: It's illogical that the legend is at the bottom. It's better to move it to the top.
  - time: 00:01:08
    speaker: Timur Khasanov
    text: Good. Also, when viewing a selected time slot, the names of the participants are now displayed.
      Previously, only the time slot itself was visible. These are all changes made based on previous
      feedback.
  - time: 00:01:37
    speaker: Customer
    text: Excellent.
- section: Final project evaluation and handover
  entries:
  - time: 00:01:39
    speaker: Nikita Lisitckii
    text: Now let's move on to a few obligatory questions. Do you think the project has been implemented
      to a sufficient extent?
  - time: 00:01:58
    speaker: Customer
    text: Yes.
  - time: 00:02:00
    speaker: Nikita Lisitckii
    text: Are there any parts of the project that should be changed now?
  - time: 00:02:06
    speaker: Customer
    text: Right now everything meets my expectations, so no.
  - time: 00:02:13
    speaker: Nikita Lisitckii
    text: Do you confirm that the deployment of the project on the 108 team side has been completed and
      the project has actually been transferred to the 108 team?
  - time: 00:02:28
    speaker: Customer
    text: Yes, I confirm.
  - time: 00:02:31
    speaker: Nikita Lisitckii
    text: What else can be done to improve the usability of the product after completing the SWP course?
  - time: 00:02:42
    speaker: Customer
    text: I'd like to test the mobile version. If it works correctly, the project can be released.
  - time: 00:02:54
    speaker: Nikita Lisitckii
    text: What kind of support will you need from us after completing the course?
  - time: 00:03:02
    speaker: Customer
    text: The project looks ready. It would be great if the team would stay in touch to fix bugs and make
      any further improvements that users might need.
  - time: 00:03:19
    speaker: Nikita Lisitckii
    text: 'It is also necessary to evaluate the `README.md` and `Customer Handover.md` files: how complete
      and understandable they are from the point of view of the customer and the developer who will work
      on the project.'
  - time: 00:03:46
    speaker: Customer
    text: Okay.
  - time: 00:03:48
    speaker: Nikita Lisitckii
    text: Then that's all.
