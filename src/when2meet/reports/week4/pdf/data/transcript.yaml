transcript:
  - section: "Sprint Review discussion with customer"
    entries:
      - time: "00:00:01"
        speaker: "Developer"
        text: "This is what our page looks like. Event creation is working. We now have the correct date selection on the calendar, as a user previously reported. Now, two types of events are created. The first type is when a specific time is set for each day, for example, from 9:00 AM to 1:00 PM, and users can select slots within that timeframe. The second mode is when people themselves select specific slots from those pre-selected by the administrator."
      - time: "00:01:27"
        speaker: "Developer"
        text: "The optional description field has also reappeared. If the administrator has selected purple slots, participants will only be able to select time within those slots."
      - time: "00:02:13"
        speaker: "Customer"
        text: "It's hard not to find fault with the design."
      - time: "00:02:16"
        speaker: "Developer"
        text: "Yes, it's still inconvenient to even select yourself. However, link sharing, which wasn't available before, now works. Clicking the link automatically links you to the meeting. We've also implemented short slugs instead of long UUIDs."
      - time: "00:02:50"
        speaker: "Customer"
        text: "Where is the mail displayed here?"
      - time: "00:02:54"
        speaker: "Developer"
        text: "Email is transferred, and I can record it. Data from Telegram is also transferred."
      - time: "00:03:17"
        speaker: "Customer"
        text: "If the user has not yet selected a time, but has already appeared in the list, this should not be considered his answer."
      - time: "00:03:26"
        speaker: "Developer"
        text: "If a time isn't selected, other participants won't see it. A user also confirmed that the redirect to SSO was implemented correctly. Overall, all functionality now works, unlike in the previous version."
      - time: "00:03:46"
        speaker: "Customer"
        text: "Haven't you integrated with the calendar yet? I need the reverse integration: I want to see my weekly schedule right when I'm selecting slots."
      - time: "00:04:00"
        speaker: "Developer"
        text: "So, do we need to mark schedule overlaps somewhere here?"
      - time: "00:04:07"
        speaker: "Customer"
        text: "Yes, we need at least the ability to optionally enable this feature."
      - time: "00:04:10"
        speaker: "Developer"
        text: "I thought about it, but it's problematic to radically change this part."
      - time: "00:04:18"
        speaker: "Customer"
        text: "Congratulations, but this will have to be done. How are things with editing?"
      - time: "00:04:25"
        speaker: "Developer"
        text: "Editing replies isn't possible yet because the backend is missing an endpoint. I'll contact the team so they can add it. The main question is how to migrate data if users have already selected a time slot, and the administrator changes slots. I plan to finish the rest within two days. A temporary rollback was required when a constant login prompt appeared after fixes."
      - time: "00:05:10"
        speaker: "Customer"
        text: "Does deleting work?"
      - time: "00:05:12"
        speaker: "Developer"
        text: "Yes, deletion works. As I already said, all functionality is operational."
      - time: "00:05:16"
        speaker: "Customer"
        text: "What is displayed in the My meetings tab?"
      - time: "00:05:20"
        speaker: "Developer"
        text: "Past meetings are displayed there. My meetings are meetings where I'm the owner. Meetings where I'm just a participant are in a different section. You can add an archive tab so they're stored there."
      - time: "00:05:34"
        speaker: "Customer"
        text: "I guess I just want past meetings to disappear."
      - time: "00:05:37"
        speaker: "Developer"
        text: "Okay, then we'll leave it like that."
      - time: "00:05:51"
        speaker: "Customer"
        text: "You forbade me to nitpick the design."
      - time: "00:05:53"
        speaker: "Developer"
        text: "The design hasn't been touched yet. I personally really don't like how it looks and works now: the selection is awkward, the elements are unsightly. It'll probably all have to be redone."
      - time: "00:06:14"
        speaker: "Customer"
        text: "Okay, you'll figure it out."

  - section: "Customer-executed UAT"
    entries:
      - time: "00:06:21"
        speaker: "Tester"
        text: "Let's run a few tests. First, let's open a prepared meeting where the grid displays the availability users have indicated. Now let's search for a specific user to ensure the search is working correctly, and then select the time they specified."
      - time: "00:07:03"
        speaker: "Customer"
        text: "Is this selectable? How will it be displayed?"
      - time: "00:07:10"
        speaker: "Tester"
        text: "No problem finding a room. Now let's try booking a room for this meeting. Clicking the booking button opens a convenient modal window with available rooms. Click Book, and the room is reserved."
      - time: "00:08:08"
        speaker: "Customer"
        text: "Does this window only show available rooms? What specific time are reservations made for? For all participants' times?"
      - time: "00:08:31"
        speaker: "Developer"
        text: "Right now, the time is simply selected, and we need to figure out a better way to implement this. Currently, the system should ask the user what time they want to book."
      - time: "00:08:42"
        speaker: "Customer"
        text: "What if there are several intersections in time or none at all?"
      - time: "00:08:46"
        speaker: "Developer"
        text: "Yes, that's a fair point, I understand you."
      - time: "00:08:50"
        speaker: "Tester"
        text: "Haven't you connected the calendar yet?"
      - time: "00:08:52"
        speaker: "Developer"
        text: "I connected it, and exporting from the app to the calendar works. But there's no reverse integration from the calendar to the app yet."
      - time: "00:09:02"
        speaker: "Tester"
        text: "Shouldn't we make it so that when adding our own timeslots, events from the user's calendar are displayed here?"
      - time: "00:09:19"
        speaker: "Developer"
        text: "This has not been implemented yet, but most likely it will not be difficult to do today."
      - time: "00:09:28"
        speaker: "Customer"
        text: "Where's the button to see the intersection of all participants' times? We discussed this earlier: if a user is colorblind and can't distinguish shades of purple, they need this feature."
      - time: "00:09:57"
        speaker: "Developer"
        text: "I remember, you just need to add one button. The calendar component is flexible, and it's convenient for doing custom things like this."
      - time: "00:10:19"
        speaker: "Customer"
        text: "Think about the implementation yourself: should you show the intersection of all participants or the majority of available ones? And one more important requirement: I want to click on a specific timeslot and see who exactly has confirmed that time as available."
      - time: "00:11:10"
        speaker: "Developer"
        text: "Okay, we'll do that. The current implementation of the minimum number of people filter isn't very user-friendly. We should probably show the data right away and make it a single button. I'll figure out a better way to implement that."
