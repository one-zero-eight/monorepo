openapi: 3.1.0
info:
  title: InNoHassle When2Meet API
  summary: InNoHassle service API.
  description: |-
    ### About this project

    Service foundation for When2Meet designed during SWP course.
  contact:
    name: one-zero-eight (Telegram)
    url: https://t.me/one_zero_eight
  license:
    name: MIT License
    identifier: MIT
  version: 0.1.0
servers:
  - url: /api/v0
    description: MVP v0
paths:
  /events/:
    post:
      tags:
        - Events
      summary: Create Event
      description: Create a new event with time slots.
      operationId: events_create_event
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
        required: true
      responses:
        "201":
          description: New event is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /events/{event_id}:
    get:
      tags:
        - Events
      summary: Get Event
      description: Get event details and participants' availability.
      operationId: events_get_event
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PydanticObjectId"
      responses:
        "200":
          description: Event info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /events/{event_id}/participants:
    put:
      tags:
        - Events
      summary: Update Participant
      description: Add or update a participant's availability for an event.
      operationId: events_update_participant
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PydanticObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantUpdate"
      responses:
        "200":
          description: Participant availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid availability slots
        "404":
          description: Event not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  schemas:
    Event:
      properties:
        id:
          anyOf:
            - $ref: "#/components/schemas/PydanticObjectId"
            - type: "null"
          description: MongoDB document ObjectID
        name:
          type: string
          title: Name
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
        slots:
          items:
            type: string
            format: date-time
          type: array
          title: Slots
        participants:
          items:
            $ref: "#/components/schemas/Participant"
          type: array
          title: Participants
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
        - id
        - name
        - description
        - slots
        - participants
        - created_at
      title: Event
    EventCreate:
      properties:
        name:
          type: string
          title: Name
          description: Name of the event
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: Description of the event
        slots:
          items:
            type: string
            format: date-time
          type: array
          title: Slots
          description: All possible slots for the event
      additionalProperties: false
      type: object
      required:
        - name
        - slots
      title: EventCreate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Participant:
      properties:
        name:
          type: string
          title: Name
          description: Name of the participant
        availability:
          items:
            type: string
            format: date-time
          type: array
          title: Availability
          description: List of slots the participant is available for
      additionalProperties: false
      type: object
      required:
        - name
        - availability
      title: Participant
    ParticipantUpdate:
      properties:
        name:
          type: string
          title: Name
          description: Name of the participant
        availability:
          items:
            type: string
            format: date-time
          type: array
          title: Availability
          description: List of slots the participant is available for
      additionalProperties: false
      type: object
      required:
        - name
        - availability
      title: ParticipantUpdate
    PydanticObjectId:
      type: string
      maxLength: 24
      minLength: 24
      pattern: ^[0-9a-f]{24}$
      example: 5eb7cf5a86d9755df3a6c593
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
tags:
  - name: Events
    description: Operations for creating and managing events, including tracking
      participant availability and scheduling time slots.
  - name: Events
    description: ""
