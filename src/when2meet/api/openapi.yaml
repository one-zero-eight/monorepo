openapi: 3.1.0
info:
  title: InNoHassle When2Meet API
  summary: InNoHassle service API.
  description: |-
    ### About this project

    Service foundation for When2Meet designed during SWP course.
  contact:
    name: one-zero-eight (Telegram)
    url: https://t.me/one_zero_eight
  license:
    name: MIT License
    identifier: MIT
  version: 0.1.0
servers:
  - url: /api/v0
    description: MVP v0
paths:
  /events/:
    get:
      tags:
        - Events
      summary: Get My Events
      description: Get events owned by the authenticated user.
      operationId: events_get_my_events
      responses:
        "200":
          description: List of events owned by the user
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EventSummary"
                type: array
                title: Response Events Get My Events
        "401":
          description: Unable to verify credentials OR Credentials not provided
      security:
        - Bearer: []
    post:
      tags:
        - Events
      summary: Create Event
      description: Create a new event with time slots.
      operationId: events_create_event
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreate"
        required: true
      responses:
        "201":
          description: New event is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventView"
        "401":
          description: Unable to verify credentials OR Credentials not provided
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
      security:
        - Bearer: []
  /events/participating:
    get:
      tags:
        - Events
      summary: Get Participating Events
      description: Get events where the authenticated user is a participant.
      operationId: events_get_participating_events
      responses:
        "200":
          description: List of events where the user is a participant
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EventSummary"
                type: array
                title: Response Events Get Participating Events
        "401":
          description: Unable to verify credentials OR Credentials not provided
      security:
        - Bearer: []
  /events/{event_ref}:
    get:
      tags:
        - Events
      summary: Get Event
      description: Get event details and participants' availability.
      operationId: events_get_event
      security:
        - Bearer: []
      parameters:
        - name: event_ref
          in: path
          required: true
          schema:
            type: string
            title: Event Ref
      responses:
        "200":
          description: Event info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventView"
        "401":
          description: Unable to verify credentials OR Credentials not provided
        "404":
          description: Event not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - Events
      summary: Update Event
      description: Update event details (owner only).
      operationId: events_update_event
      security:
        - Bearer: []
      parameters:
        - name: event_ref
          in: path
          required: true
          schema:
            type: string
            title: Event Ref
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventView"
        "400":
          description: Participant {p.user_id} has availability at {slot} which is not in
            the new slots
        "401":
          description: Unable to verify credentials OR Credentials not provided
        "403":
          description: Not an owner
        "404":
          description: Event not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - Events
      summary: Delete Event
      description: Delete an event (owner only).
      operationId: events_delete_event
      security:
        - Bearer: []
      parameters:
        - name: event_ref
          in: path
          required: true
          schema:
            type: string
            title: Event Ref
      responses:
        "204":
          description: Event deleted
        "401":
          description: Unable to verify credentials OR Credentials not provided
        "403":
          description: Not an owner
        "404":
          description: Event not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /events/{event_ref}/participants:
    put:
      tags:
        - Events
      summary: Update Participant
      description: Add or update a participant's availability for an event.
      operationId: events_update_participant
      security:
        - Bearer: []
      parameters:
        - name: event_ref
          in: path
          required: true
          schema:
            type: string
            title: Event Ref
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantUpdate"
      responses:
        "200":
          description: Participant availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventView"
        "400":
          description: Invalid availability slots
        "401":
          description: Unable to verify credentials OR Credentials not provided
        "404":
          description: Event not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /events/{event_ref}/participants/{user_id}:
    delete:
      tags:
        - Events
      summary: Delete Participant
      description: Remove a participant from an event (owner or the participant themselves).
      operationId: events_delete_participant
      security:
        - Bearer: []
      parameters:
        - name: event_ref
          in: path
          required: true
          schema:
            type: string
            title: Event Ref
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            title: User Id
      responses:
        "200":
          description: Participant removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventView"
        "401":
          description: Unable to verify credentials OR Credentials not provided
        "403":
          description: Not allowed to remove this participant
        "404":
          description: Event or participant not found
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  schemas:
    EventCreate:
      properties:
        name:
          type: string
          title: Name
          description: Name of the event
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: Description of the event
        slots:
          items:
            type: string
            format: date-time
          type: array
          title: Slots
          description: All possible slots for the event
        timezone:
          type: string
          title: Timezone
          description: IANA timezone name
          default: UTC
        specific_time:
          type: boolean
          title: Specific Time
          description: Whether the event has specific time slots
          default: false
        time_range:
          anyOf:
            - $ref: "#/components/schemas/TimeRange"
            - type: "null"
          description: Optional metadata for display/edit
      additionalProperties: false
      type: object
      required:
        - name
        - slots
      title: EventCreate
    EventSummary:
      properties:
        id:
          $ref: "#/components/schemas/PydanticObjectId"
          description: Event ID
        slug:
          type: string
          title: Slug
          description: Short URL-safe public event reference
        name:
          type: string
          title: Name
          description: Name of the event
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: Description of the event
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Time when the event was created
        participants_count:
          type: integer
          title: Participants Count
          description: Number of participants in the event
        date_range_label:
          anyOf:
            - type: string
            - type: "null"
          title: Date Range Label
          description: Optional; frontend can derive from slots
      additionalProperties: false
      type: object
      required:
        - id
        - slug
        - name
        - created_at
        - participants_count
      title: EventSummary
    EventUpdate:
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
          description: Name of the event
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: Description of the event
        slots:
          anyOf:
            - items:
                type: string
                format: date-time
              type: array
            - type: "null"
          title: Slots
          description: All possible slots for the event
        timezone:
          anyOf:
            - type: string
            - type: "null"
          title: Timezone
          description: IANA timezone name
        specific_time:
          anyOf:
            - type: boolean
            - type: "null"
          title: Specific Time
          description: Whether the event has specific time slots
        time_range:
          anyOf:
            - $ref: "#/components/schemas/TimeRange"
            - type: "null"
          description: Optional metadata for display/edit
      additionalProperties: false
      type: object
      title: EventUpdate
    EventView:
      properties:
        id:
          $ref: "#/components/schemas/PydanticObjectId"
          description: Event ID
        slug:
          type: string
          title: Slug
          description: Short URL-safe public event reference
        name:
          type: string
          title: Name
          description: Name of the event
        description:
          anyOf:
            - type: string
            - type: "null"
          title: Description
          description: Description of the event
        slots:
          items:
            type: string
            format: date-time
          type: array
          title: Slots
          description: All possible slots for the event
        participants:
          items:
            $ref: "#/components/schemas/ParticipantView"
          type: array
          title: Participants
          description: Participants with profile data and availability
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Time when the event was created
        timezone:
          type: string
          title: Timezone
          description: IANA timezone name
          default: UTC
        owner_id:
          anyOf:
            - type: string
            - type: "null"
          title: Owner Id
          description: ID of the user who created the event
        specific_time:
          type: boolean
          title: Specific Time
          description: Whether the event has specific time slots
          default: false
        time_range:
          anyOf:
            - $ref: "#/components/schemas/TimeRange"
            - type: "null"
          description: Optional metadata for display/edit
      additionalProperties: false
      type: object
      required:
        - id
        - slug
        - name
        - slots
        - participants
        - created_at
      title: EventView
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ParticipantUpdate:
      properties:
        availability:
          items:
            type: string
            format: date-time
          type: array
          title: Availability
          description: List of slots the participant is available for
      additionalProperties: false
      type: object
      required:
        - availability
      title: ParticipantUpdate
    ParticipantView:
      properties:
        user_id:
          type: string
          title: User Id
          description: InNoHassle Accounts user ID
        email:
          anyOf:
            - type: string
            - type: "null"
          title: Email
          description: Innopolis email
        name:
          anyOf:
            - type: string
            - type: "null"
          title: Name
          description: Full name of the participant
        telegram:
          anyOf:
            - type: string
            - type: "null"
          title: Telegram
          description: Telegram @username if linked
        availability:
          items:
            type: string
            format: date-time
          type: array
          title: Availability
          description: List of slots the participant is available for
      additionalProperties: false
      type: object
      required:
        - user_id
        - availability
      title: ParticipantView
    PydanticObjectId:
      type: string
      maxLength: 24
      minLength: 24
      pattern: ^[0-9a-f]{24}$
      example: 5eb7cf5a86d9755df3a6c593
    TimeRange:
      properties:
        start:
          type: string
          title: Start
        end:
          type: string
          title: End
      additionalProperties: false
      type: object
      required:
        - start
        - end
      title: TimeRange
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
  securitySchemes:
    Bearer:
      type: http
      description: >-
        Token from [InNoHassle Accounts](https://innohassle.ru/account/token)
        (`JWT`).


        When **`accounts.mock`** is enabled (development-only; gated in
        settings): the Bearer credential may instead be JSON with
        `innohassle_id`, `email`, and optional `telegram_id` (same shape as user
        token payload; see **`UserTokenData`** in schemas).
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Events
    description: Operations for creating and managing events, including tracking
      participant availability and scheduling time slots.
  - name: Events
    description: ""
