student-affairs = []

[tool.uv]
default-groups = "all"
constraint-dependencies = ["urllib3>=2.7.0", "idna>=3.15"] # for security related pins

[tool.uv.sources]
requests-curl = { git = "https://github.com/paivett/requests-curl.git", rev = "82a7fc1" }

[tool.ruff]
extend-exclude = [".agents/skills"]
line-length = 120
lint.preview = true
lint.extend-select = [
    "E", # pycodestyle error
    "I", # isort
    "N", # pep-8 naming
    "S", # bandit
    "UP", # pyupgrade
    "PL", # pylint
    "A", # flake8-builtins
    "DTZ", # flake8-datetimez
    "ICN", # flake8-import-conventions
    "TID251", # flake8-tidy-imports banned-api
]
lint.extend-ignore = [
    "PLC0415", # import-outside-top-level
    "PLR", # pylint refactor
    "E501", # line-too-long (handled by formatter)
    "PLW1514", # unspecified-encoding in open(...) function
]
lint.unfixable = ["F401"] # unused-import — report only, do not remove on fix
target-version = "py314"
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is standard in pytest
[tool.ruff.lint.flake8-builtins]
ignorelist = ["id"]
[tool.ruff.lint.flake8-import-conventions]
banned-from = ["datetime", "time"]
[tool.ruff.lint.flake8-import-conventions.aliases]
datetime = "dtm"
time = "tm"
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.14+ uses deferred annotations by default; do not use this future import."

[tool.ty.src]
exclude = [".agents/skills"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
relative_files = true
omit = ["*/__main__.py", "*/logging_.py"]
