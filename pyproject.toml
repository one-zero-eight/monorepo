[project]
name = "monorepo"
version = "0.1.0"
description = ""
authors = [{ name = "one-zero-eight" }]
urls = { homepage = "https://t.me/one_zero_eight" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0", # ~14 KiB
    "beanie>=2.1.0", # ~91 KiB
    "colorlog>=6.10.1", # ~11 KiB
    "cryptography>=48.0.0", # ~7.6 MiB
    "fastapi>=0.136.1", # ~115 KiB
    "fastapi-derive-responses>=0.1.7", # ~8 KiB
    "fastapi-swagger>=0.4.49", # ~435 KiB
    "gunicorn>=26.0.0", # ~207 KiB
    "httpx>=0.28.1", # ~72 KiB
    "joserfc>=1.6.5", # ~69 KiB
    "minio>=7.2.20", # ~92 KiB
    "pydantic>=2.13.4", # ~461 KiB
    "pydantic-settings>=2.14.0", # ~60 KiB
    "python-magic>=0.4.27", # ~14 KiB | depends on libmagic
    "python-multipart>=0.0.27", # ~29 KiB
    "pytz>=2026.2", # ~498 KiB
    "pyyaml>=6.0.3", # ~861 KiB
    "uvicorn>=0.46.0", # ~69 KiB
]

[dependency-groups]
dev = [
    "prek>=0.3.13", # ~6.4 MiB
    "pytest>=9.0.3", # ~366 KiB
    "pytest-asyncio>=1.3.0", # ~15 KiB
    "pytest-cov>=7.1.0", # ~22 KiB
    "respx>=0.23.1",
    "ruff>=0.15.12", # ~11.5 MiB
    "testcontainers>=4.14.2",
    "types-pyyaml>=6.0.12.20260408", # ~20 KiB
]
events = [
    "alembic>=1.18.4", # ~258 KiB
    "asyncpg>=0.31.0", # ~3.4 MiB
    "icalendar>=7.1.0", # ~460 KiB
    "prometheus-fastapi-instrumentator>=7.1.0", # ~19 KiB
    "sqlalchemy[postgresql-asyncpg]>=2.0.49", # ~3.4 MiB
]
room-booking = [
    "exchangelib>=5.6.0", # ~238 KiB
    "requests-curl", # depends on curl runtime
]
maps = [
    "rapidfuzz>=3.14.5", # ~4.1 MiB
]
clubs = [
    "pyvips>=3.1.1", # ~56 KiB | depends on libvips
]
workshops = [
    "alembic>=1.18.4", # ~258 KiB
    "asyncpg>=0.31.0", # ~3.4 MiB
    "sqlalchemy>=2.0.49", # ~3.4 MiB
    "sqlmodel>=0.0.38", # ~27 KiB
]
forms = [
    "nanoid>=2.0.0", # ~6 KiB
]
guard = [
    "google-api-python-client>=2.196.0", # ~14.5 MiB
    "google-auth>=2.51.0", # ~240 KiB
    "google-auth-oauthlib>=1.4.0", # ~19 KiB
]
schedule-builder-backend = [
    "numpy>=2.4.4", # ~17.8 MiB
    "openpyxl>=3.1.5", # ~245 KiB
    "pandas>=3.0.2", # ~11.8 MiB
]
search = [
    "apscheduler>=3.11.2", # ~63 KiB
    "beautifulsoup4>=4.14.3", # ~105 KiB
    "fake-useragent>=2.2.0", # ~158 KiB
    "markdownify>=1.2.2", # ~15 KiB
    "motor>=3.7.1", # ~73 KiB
    "openai>=2.35.1", # ~1.2 MiB
    "requests>=2.33.1", # ~63 KiB
    "sentencepiece>=0.2.1", # ~1.9 MiB
    "unicorn>=2.1.4", # ~19.6 MiB
]
student-affairs = []

[tool.uv]
default-groups = "all"

[tool.uv.sources]
requests-curl = { git = "https://github.com/paivett/requests-curl.git", rev = "82a7fc1" }

[tool.ruff]
line-length = 120
lint.extend-select = ["I", "UP", "PL"]
lint.extend-ignore = ["PLC0415", "PLR"]
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/__main__.py", "*/logging_.py"]
