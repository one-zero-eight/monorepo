name: Run prek

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 👾 Check out repository
        uses: actions/checkout@v7
      - name: 📦 Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          activate-environment: true
      - name: 📦 Install the project
        run: uv sync
      - name: 🧪 Run prek
        run: |
          set +e
          log="$(mktemp)"
          uv run prek run --show-diff-on-failure --color=never --all-files --hook-stage manual >"$log" 2>&1
          status=$?
          {
            echo "## prek"
            echo '```text'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$log"
          exit "$status"
        env:
          RUFF_FORMAT: github
