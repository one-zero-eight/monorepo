name: When2Meet docs

on:
  push:
    branches: [main]
    paths:
      - "src/when2meet/docs/**"
      - "src/when2meet/mkdocs.yml"
      - ".github/workflows/when2meet-docs.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: when2meet-docs-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install mkdocs-material

      - name: Build MkDocs site
        working-directory: src/when2meet
        run: |
          mkdocs build
          touch site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: src/when2meet/site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "docs(when2meet): publish MkDocs site"
