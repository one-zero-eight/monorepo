name: Run tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests on
        required: true
        default: main
        type: string

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      checks: write
      pull-requests: write

    # Host ports match docker-compose.test.yaml (37017, 19000); service containers use default listen ports inside.
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 37017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        options: >-
          --health-cmd "mongosh 'mongodb://test:test@localhost:27017/admin' --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:RELEASE.2024-05-10T01-41-38Z
        command: server /data --console-address ":9001"
        ports:
          - 19000:9000
          - 19001:9001
        env:
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: testsecret
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 👾 Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: 📦 Install native libraries
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libmagic1 libvips-dev
          version: 1.0

      - name: 📦 Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          activate-environment: true

      - name: 📦 Install the project
        run: uv sync --frozen

      - name: 🧪 Run tests
        run: |
          mkdir -p reports
          uv run -m pytest \
            --junitxml=reports/junit.xml \
            --cov-report=xml:coverage.xml

      - name: 📤 Upload reports
        uses: actions/upload-artifact@v7
        if: (!cancelled())
        with:
          name: pytest-reports
          path: |
            reports/junit.xml
            coverage.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: 📋 Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled()) && hashFiles('reports/junit.xml') != ''
        with:
          files: reports/junit.xml
          check_name: pytest

      - name: 📊 Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        if: github.event_name == 'pull_request' && (!cancelled()) && hashFiles('coverage.xml') != ''
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 📊 Coverage summary
        if: (!cancelled()) && hashFiles('coverage.xml') != ''
        run: |
          {
            echo "## Coverage"
            echo '```'
            uv run coverage report --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
