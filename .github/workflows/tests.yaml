name: Run tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests on
        required: true
        default: main
        type: string

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      checks: write
      pull-requests: write

    # Host ports match docker-compose.test.yaml (37017, 19000, 35432); service containers use default listen ports inside.
    services:
      postgres:
        image: postgres:17.1
        ports:
          - 35432:5432
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:8.2
        ports:
          - 37017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test

      minio:
        image: minio/minio:RELEASE.2024-05-10T01-41-38Z
        command: server /data --console-address ":9001"
        ports:
          - 19000:9000
          - 19001:9001
        env:
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: testsecret

    steps:
      - name: 👾 Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: 📦 Install native libraries
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libmagic1
          version: 1.0

      - name: 📦 Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          activate-environment: true

      - name: 📦 Install the project
        run: uv sync --frozen

      - name: 🧪 Run tests
        id: tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p reports
          uv run -m pytest \
            --color=no \
            --memray \
            --junitxml=reports/junit.xml \
            --cov-report=xml:coverage.xml \
            --cov-report=markdown:coverage.md 2>&1 | tee reports/pytest.log

          grep -v "100% |" coverage.md > coverage-skip-covered.md
          delimiter="$(openssl rand -hex 16)"
          {
            echo "coverage_md<<$delimiter"
            cat coverage-skip-covered.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: 📤 Upload reports
        uses: actions/upload-artifact@v7
        if: (!cancelled())
        with:
          name: pytest-reports
          path: |
            reports/junit.xml
            coverage.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: 📋 Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled()) && hashFiles('reports/junit.xml') != ''
        with:
          files: reports/junit.xml
          check_run: false
          comment_title: |
            Coverage

            ${{ steps.tests.outputs.coverage_md }}

            ## Tests

      - name: 📋 pytest log
        if: (!cancelled()) && hashFiles('reports/pytest.log') != ''
        run: |
          {
            echo "<details>"
            echo "<summary>pytest output</summary>"
            echo ""
            echo '```text'
            cat reports/pytest.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
