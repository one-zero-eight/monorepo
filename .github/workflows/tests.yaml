name: Run tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run tests on
        required: true
        default: main
        type: string

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      checks: write
      pull-requests: write

    # Host ports match docker-compose.test.yaml; GitHub manages container startup and cleanup.
    services:
      postgres:
        image: postgres:17.1
        ports:
          - 35432:5432
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:8.3.11
        ports:
          - 37017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
          MONGO_REPLICA_HOST: localhost:27017
        # Services start before checkout, so the ephemeral CI key must be created inline.
        entrypoint: bash
        command: >-
          -ec "umask 077;
          openssl rand -base64 756 > /data/configdb/replica-set.key;
          chown mongodb:mongodb /data/configdb/replica-set.key;
          chmod 400 /data/configdb/replica-set.key;
          exec /usr/local/bin/docker-entrypoint.sh mongod
          --replSet rs0 --keyFile /data/configdb/replica-set.key --bind_ip_all"

      minio:
        image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
        command: server /data --console-address ":9001"
        ports:
          - 19000:9000
          - 19001:9001
        env:
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: testsecret

    steps:
      - name: 👾 Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Initialize MongoDB replica set
        env:
          MONGO_CONTAINER: ${{ job.services.mongodb.id }}
        run: |
          docker cp scripts/mongodb/ready.js "$MONGO_CONTAINER:/tmp/replica-set-ready.js"
          timeout 180s bash -c '
            until docker exec "$MONGO_CONTAINER" mongosh --quiet --nodb /tmp/replica-set-ready.js; do
              sleep 2
            done
          '

      - name: 📦 Install native libraries
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libmagic1
          version: 1.0

      - name: 📦 Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          activate-environment: true

      - name: 📦 Install the project
        run: uv sync --frozen

      - name: 🧪 Run tests
        id: tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p reports

          uv run -m pytest \
            --color=no \
            --memray \
            --junitxml=reports/junit.xml \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=markdown:reports/coverage.md \
            2>&1 | tee reports/pytest.log

          grep -v "100% |" reports/coverage.md > reports/coverage-skip-covered.md || cp reports/coverage.md reports/coverage-skip-covered.md
          delimiter="$(openssl rand -hex 16)"
          {
            echo "coverage_md<<$delimiter"
            cat reports/coverage-skip-covered.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Test infrastructure logs
        if: failure()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MONGO_CONTAINER: ${{ job.services.mongodb.id }}
          MINIO_CONTAINER: ${{ job.services.minio.id }}
        run: |
          docker logs "$POSTGRES_CONTAINER"
          docker logs "$MONGO_CONTAINER"
          docker logs "$MINIO_CONTAINER"

      - name: 📤 Upload reports
        uses: actions/upload-artifact@v7
        if: (!cancelled())
        with:
          name: pytest-reports
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/pytest.log
          retention-days: 30
          if-no-files-found: ignore

      - name: 📋 pytest log
        if: (!cancelled()) && hashFiles('reports/pytest.log') != ''
        run: |
          {
            echo "<details>"
            echo "<summary>pytest output</summary>"
            echo ""
            echo '```text'
            cat reports/pytest.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📋 Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled()) && hashFiles('reports/junit.xml') != ''
        with:
          files: reports/junit.xml
          check_run: false
          comment_title: |
            Coverage

            ${{ steps.tests.outputs.coverage_md }}

            ## Tests
