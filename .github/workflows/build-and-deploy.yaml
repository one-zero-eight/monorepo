# Example workflow for repos that build a Docker image and deploy via the deployer API.
#
# Copy to .github/workflows/build-and-deploy.yaml in your application repo and adjust:
#   - file: ./api.Dockerfile          (path to your Dockerfile)
#   - org secrets:
#       DEPLOYER_STAGING_URL
#       DEPLOYER_STAGING_WEBHOOK_SECRET
#       DEPLOYER_PRODUCTION_URL
#       DEPLOYER_PRODUCTION_WEBHOOK_SECRET
#   - repository key                   (must match deployer settings.yaml repositories map)
#   - service options                  (must match docker-compose service names)
#

name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      service:
        description: Compose service to deploy
        type: choice
        required: true
        default: all
        options:
          - all
          - maps
          - clubs
          - student-affairs
          - when2meet
          - guard
          - forms
          - room-booking
          - schedule
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build and push image to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      security-events: write

    outputs:
      imageid: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api.Dockerfile
          push: ${{ github.repository_owner == 'one-zero-eight' && 'true' || 'false' }}
          tags: ghcr.io/one-zero-eight/monorepo:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: one-zero-eight/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Update staging image tag
        run: |
          sed -i 's|image: ghcr.io/one-zero-eight/monorepo:.*|image: ghcr.io/one-zero-eight/monorepo:sha-${{ github.sha }}|' \
            infra/stacks/staging/when2meet/docker-compose.yaml

      - name: Commit staging change
        run: |
          cd infra
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add stacks/staging/when2meet/docker-compose.yaml
          git commit -m "staging: promote myapp to sha-${{ github.sha }}" || exit 0
          git push
