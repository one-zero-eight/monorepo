name: Other PBI
description: Supporting or technical product backlog item
title: "[When2Meet] "
labels: ["when2meet"]
body:
  - type: dropdown
    id: pbi_type
    attributes:
      label: Type
      options:
        - Task
        - Integration
        - Documentation
        - Design
        - Infrastructure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Required when the item is Sprint-ready or part of MVP v1
  - type: dropdown
    id: moscow
    attributes:
      label: MoSCoW priority
      options:
        - Must Have
        - Should Have
        - Could Have
        - Won't Have
  - type: input
    id: story_points
    attributes:
      label: Story points
  - type: input
    id: reviewer
    attributes:
      label: Reviewer (GitHub username)
  - type: dropdown
    id: mvp_version
    attributes:
      label: MVP version
      options:
        - mvp-v1
        - mvp-v2
        - mvp-v3
        - none
  - type: input
    id: parent_story
    attributes:
      label: Parent user story (stable ID or issue #)
      placeholder: US-001 or #55
