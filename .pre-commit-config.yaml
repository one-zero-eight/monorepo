# Prek configuration.
# https://prek.j178.dev/configuration/

# uv run prek install --overwrite --prepare-hooks -t pre-commit -t commit-msg
# uv run prek auto-update
# uv run prek run --all-files

default_stages:
  - pre-commit
  - pre-push
  - commit-msg
  - manual

repos:
  # Fix some errors with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [ --fix, --exit-zero ]
        name: "ruff: fixing"
      - id: ruff-format
        name: "ruff: formatting"

  # Lint Python files with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        name: "ruff: linting"

  # Check other files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/clients/(clubs|events|room_booking|schedule_assistant|music_room|sport_v3)/
      - id: end-of-file-fixer
        exclude: ^src/clients/(clubs|events|room_booking|schedule_assistant|music_room|sport_v3)/
      - id: check-added-large-files

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope, --verbose]

  # Local linting
  - repo: local
    hooks:
      - id: generated-http-clients
        name: check generated local HTTP clients
        language: system
        entry: uv run -m scripts.generate_clients --check
        pass_filenames: false
        files: ^(src/|scripts/(export_openapi|generate_clients)\.py$|pyproject\.toml$|uv\.lock$|settings\.example\.yaml$)
      - id: ty
        name: ty check
        language: system
        entry: uv run ty check
        pass_filenames: false
        types: [python]
      - id: generate-settings-schema
        name: generate settings.schema.yaml
        language: system
        entry: uv run ./scripts/generate_settings_schema.py
        pass_filenames: false
        files: ^src/config_schema.py$
